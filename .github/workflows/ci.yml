name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore MiniMCP.AzureDevOps.slnx

      - name: Build
        run: dotnet build MiniMCP.AzureDevOps.slnx --no-restore --no-incremental -warnaserror

      - name: Test
        run: dotnet test MiniMCP.AzureDevOps.slnx --no-build --logger "console;verbosity=normal"
